server.port=8080
spring.application.name=tokenlab
# Same as the original's dotenv.config(): read the repo-root .env (cwd is backend/ under spring-boot:run, repo root for a jar).
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Disable Spring Security default login page
spring.security.user.password=disabled

# Gemini
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# Auth
auth.admin-username=${ADMIN_USERNAME:yuzeeadmin}
auth.admin-password=${ADMIN_PASSWORD:yuzeeadmin@2026}
auth.secret=${AUTH_SECRET:yuzee-lab-secret-2026}

# Database
spring.datasource.url=${DATABASE_URL:}

# Warehouse
warehouse.db-path=${YUZEE_WAREHOUSE_DB:}
warehouse.index-path=${WAREHOUSE_INDEX_PATH:data/warehouse/catalogue.sqlite}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# Actuator
management.endpoints.web.exposure.include=health,info

# Static resources (Angular build)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

logging.level.com.yuzee=INFO

# Cloudflare Workers AI (optional server-side router fallback -- POST /api/routing/llm)
cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}

# Detail research (DetailResearchService) -- grounded-search follow-up answers
research.model=${RESEARCH_MODEL:gemini-3.7-flash}
research.trusted-domains=${RESEARCH_TRUSTED_DOMAINS:}
