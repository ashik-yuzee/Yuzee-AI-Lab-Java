@if (o.enabled() && sessions.length) {
  <div class="objective-chat-history">
    @for (s of sessions; track s.id) {
      <section class="objective-chat-receipt"><div><app-icon name="BookOpen" [size]="19" /><strong>{{ activityTitle(s) }}</strong><span>{{ stateLabel(s) }}</span></div><app-answer-history [session]="s" /><button (click)="o.showSession(s.id)">View saved activity <app-icon name="ArrowUpRight" [size]="16" /></button></section>
    }
  </div>
}
