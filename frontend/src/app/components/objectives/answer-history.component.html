<ng-template #entered let-entry let-pending="pending">
  <details class="objective-entered"><summary><app-icon name="CheckCircle2" [size]="17" /><span>{{ entry.question }}</span><small>{{ status(entry, pending) }}</small></summary><div class="objective-answer-value">{{ answerText(entry.answer) }}</div>@if (entry.submittedAt) {<time [attr.datetime]="iso(entry.submittedAt)">{{ local(entry.submittedAt) }}</time>}</details>
</ng-template>

@if (answers.length || session.pendingAnswer) {
  <section class="objective-answer-history" aria-label="Saved answers">
    <h3>Your answers</h3>
    @for (a of answers; track a.id) {<ng-container *ngTemplateOutlet="entered; context: { $implicit: a, pending: false }" />}
    @if (session.pendingAnswer) {<ng-container *ngTemplateOutlet="entered; context: { $implicit: session.pendingAnswer, pending: true }" />}
  </section>
}
