@switch (kind()) {
  @case ('unknown') { <span class="objective-unknown">Not yet known</span> }
  @case ('scalar') { <span>{{ scalar() }}</span> }
  @case ('note') { <app-evidence-note [note]="value" /> }
  @case ('list') { <ul>@for (v of value; track $index) {<li><app-result-value [value]="v" /></li>}</ul> }
  @case ('emptyList') { <span class="objective-unknown">No details supplied</span> }
  @default { <dl class="objective-result-fields">@for (f of fields(); track f[0]) {<dt>{{ key(f[0]) }}</dt><dd><app-result-value [value]="f[1]" /></dd>}</dl> }
}
