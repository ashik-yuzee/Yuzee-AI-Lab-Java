@if (!hidden()) {
  @if (item(); as item) {
    <div class="objective-offer"><app-icon name="Sparkles" [size]="20" /><div><small>Explore this further</small><button [disabled]="o.busy()" (click)="o.start(item.tool_id)">{{ item.button_label }}<app-icon name="ArrowRight" [size]="18" /></button><p>{{ offer().reason }}</p></div><button class="objective-dismiss" aria-label="Dismiss activity suggestion" (click)="dismiss()">×</button></div>
  } @else if (status()) {
    <p class="objective-status" role="status">{{ status() }}</p>
  }
}
