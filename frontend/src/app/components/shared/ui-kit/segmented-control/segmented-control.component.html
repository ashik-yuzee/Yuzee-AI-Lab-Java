<div class="btn-group segmented-control" role="tablist" [class.segmented-control-sm]="size === 'sm'">
  @for (opt of options; track opt.id) {
    <input
      type="radio"
      class="btn-check"
      [id]="controlId + '-' + opt.id"
      [name]="controlId"
      autocomplete="off"
      [checked]="opt.id === value"
      (change)="select(opt.id)" />
    <label class="segmented-control-btn" [for]="controlId + '-' + opt.id" role="tab" [attr.aria-selected]="opt.id === value">
      @if (opt.icon) { <i class="segmented-control-icon {{ opt.icon }}" aria-hidden="true"></i> }
      <span>{{ opt.label }}</span>
      @if (opt.badge) { <span class="segmented-control-badge">{{ opt.badge }}</span> }
    </label>
  }
</div>
