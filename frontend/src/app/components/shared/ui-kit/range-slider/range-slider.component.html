<div class="slider">
  <div class="slider-head">
    <label [attr.for]="id" class="slider-label">{{ label }}</label>
    <span class="slider-value">{{ displayValue }}</span>
  </div>

  <div class="slider-track">
    <input
      #input
      [attr.id]="id"
      type="range"
      [min]="min"
      [max]="max"
      [step]="step"
      [value]="value"
      (input)="onInput($event)"
      class="slider-input"
    />
  </div>

  @if (minLabel || maxLabel || helperText) {
    <div class="slider-foot">
      <span>{{ minLabel || (min + unit) }}</span>
      @if (helperText) { <span class="slider-helper">{{ helperText }}</span> }
      <span>{{ maxLabel || (max + unit) }}</span>
    </div>
  }
</div>
