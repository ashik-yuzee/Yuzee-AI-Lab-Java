@if (isOpen) {
  <div class="cd-overlay">
    <div
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="apple-confirm-title"
      aria-describedby="apple-confirm-desc"
      class="cd-dialog apple-glass apple-dialog-shadow"
    >
      <div class="cd-icon-wrap">
        <app-icon name="AlertTriangle" class="cd-icon" [class.is-destructive]="isDestructive" [class.is-warning]="!isDestructive" />
      </div>

      <h3 id="apple-confirm-title" class="cd-title">{{ title }}</h3>

      <p id="apple-confirm-desc" class="cd-desc">{{ dialogText }}</p>

      <div class="cd-actions">
        <button #cancelBtn type="button" (click)="cancelled.emit()" class="cd-cancel">{{ cancelLabel }}</button>
        <button
          type="button"
          (click)="confirmed.emit()"
          class="cd-confirm"
          [class.is-destructive]="isDestructive"
          [class.is-primary]="!isDestructive"
        >
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
