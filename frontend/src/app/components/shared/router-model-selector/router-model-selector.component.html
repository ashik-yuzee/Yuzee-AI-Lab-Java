<section class="rms" aria-label="Routing model">
  <label [attr.for]="id" class="rms-label">Routing model</label>
  <select [id]="id" [value]="selected()" (change)="onSelect($event)" class="rms-select">
    @for (m of models; track m.id) {
      <option [value]="m.id" [selected]="m.id === selected()">{{ m.label }}{{ m.tokenBudget ? ' — ' + m.tokenBudget + ' tokens' : ' — server-side' }}</option>
    }
  </select>
  <p class="rms-desc">{{ description }}</p>
  <p class="rms-note">Chooses relevant skills and pathways. Gemini writes the answer. One BGE model is shared across skills, questions and pathways. Each has its own matching rules.</p>
  <p class="rms-desc" role="status">{{ statusText }}@if (status() === 'unavailable') {<button type="button" class="rms-retry" (click)="retry()">Retry</button>}</p>
</section>
