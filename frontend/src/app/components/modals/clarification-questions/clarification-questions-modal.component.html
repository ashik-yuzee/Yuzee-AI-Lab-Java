<div class="cqm-overlay">
  <div class="cqm-panel">
    <!-- Header -->
    <div class="cqm-header">
      <div class="cqm-header-left">
        <div class="cqm-header-icon">
          <app-icon name="HelpCircle" class="cqm-icon-4" />
        </div>
        <div>
          <h2 class="cqm-title">A few quick questions</h2>
          <p class="cqm-subtitle">Your answers help Oala give much better guidance</p>
        </div>
      </div>
      <button (click)="handleSkip()" class="cqm-close" title="Skip questions">
        <app-icon name="X" class="cqm-icon-5" />
      </button>
    </div>

    <!-- Content -->
    <div class="cqm-content">
      <app-clarification-questions-card [questions]="questions" [bridgeMessage]="bridgeMessage" (submitted)="handleSubmit($event)" />
    </div>

    <!-- Escape hatch -->
    <div class="cqm-footer">
      <div class="cqm-escape-row">
        @for (label of escapeHatches; track label) {
          <button (click)="escape(label)" class="cqm-escape">{{ label }}</button>
        }
      </div>
    </div>
  </div>
</div>
