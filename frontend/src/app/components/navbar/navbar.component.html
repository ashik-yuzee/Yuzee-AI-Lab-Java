<header id="main-header">
  <!-- Left: Brand & Mobile Sidebar Toggle -->
  <div class="nav-left">
    <button
      id="btn-toggle-sidebar"
      type="button"
      (click)="toggleSidebar()"
      class="nav-toggle"
      title="Toggle Navigation"
      aria-label="Toggle Navigation"
    >
      <app-icon name="Menu" class="nav-icon-5" />
    </button>
    <div id="saved-pathways-control"></div>
  </div>

  <!-- Middle: Selectors + actions — hidden entirely on mobile, visible md+ -->
  <div class="nav-middle">
    <app-searchable-select
      [id]="'select-model'"
      [value]="modelValue"
      [options]="modelOptions"
      (valueChange)="onModelChange($event)"
      leadingIcon="Cpu"
      [compact]="true"
      popoverWidth="w-80 sm:w-96"
      [showSearchThreshold]="5"
    />

    <app-searchable-select
      [id]="'select-optimization-mode'"
      [value]="displayMode"
      [options]="modeOptions"
      (valueChange)="onModeChange($event)"
      leadingIcon="Sparkles"
      [compact]="true"
      popoverWidth="w-72 sm:w-84"
      [showSearchThreshold]="10"
    />

    <app-searchable-select
      [id]="'select-router-model'"
      [value]="routerModelId()"
      [options]="routerModelOptions"
      (valueChange)="onRouterModelChange($event)"
      leadingIcon="Bot"
      [compact]="true"
      popoverWidth="w-72"
      [showSearchThreshold]="10"
    />

    <button
      id="btn-pathway"
      type="button"
      (click)="togglePathway()"
      class="nav-pathway"
      [class.is-active]="lab.isWhiteboardOpen()"
      [class.is-idle]="!lab.isWhiteboardOpen()"
      [title]="lab.isWhiteboardOpen() ? 'Close pathway' : 'Open pathway'"
    >
      <app-icon name="Network" class="nav-pathway-icon" />
      <span>Pathway</span>
    </button>

    <button
      id="btn-renderer"
      type="button"
      (click)="openRenderer.emit()"
      class="nav-tool"
      title="Protocol v1.3 Renderer"
    >
      <app-icon name="FileJson" class="nav-tool-icon" />
      <span>Renderer</span>
    </button>

    <button
      id="btn-lab"
      type="button"
      (click)="openLab()"
      class="nav-tool"
      title="Lab Tools"
    >
      <app-icon name="Wrench" class="nav-tool-icon" />
      <span>Lab</span>
    </button>
  </div>

  <!-- Mobile-only: model selector -->
  <div class="nav-mobile">
    <app-searchable-select
      [id]="'select-model-mobile'"
      [value]="modelValue"
      [options]="modelOptions"
      (valueChange)="onModelChange($event)"
      leadingIcon="Cpu"
      [compact]="true"
      popoverWidth="w-72"
      [showSearchThreshold]="5"
    />
  </div>

  <!-- Right: Settings + Conv Cost + Telemetry Pill -->
  <div class="nav-right">
    <button
      id="btn-open-profile"
      type="button"
      (click)="lab.isProfileOpen.set(true)"
      class="nav-profile"
      title="User Profile — facts Oala learns about you"
      aria-label="User Profile"
    >
      <app-icon name="User" class="nav-icon-4" />
      @if (lab.userProfile().length > 0 || hasUnresolvedContradictions) {
        <span class="nav-profile-badge" [class.warn]="hasUnresolvedContradictions" [class.ok]="!hasUnresolvedContradictions">{{ hasUnresolvedContradictions ? '!' : lab.userProfile().length > 9 ? '9+' : lab.userProfile().length }}</span>
      }
    </button>

    <button
      id="btn-open-settings"
      type="button"
      (click)="lab.isSettingsOpen.set(true)"
      class="nav-settings"
      title="App Settings (storage, API status)"
      aria-label="Settings"
    >
      <app-icon name="Settings" class="nav-icon-4" />
    </button>

    @if (hasAssistantMsg) {
      <span
        class="nav-cost"
        title="Estimated cost for this conversation. All-conversation totals are in the Overall Telemetry sidebar."
      >
        <span class="nav-cost-label">Conv</span>
        {{ lab.formatCost(lab.currentConversationCost()) }}
      </span>
    }

    <button
      id="btn-header-telemetry-pill"
      type="button"
      (click)="toggleTelemetry()"
      class="nav-telemetry"
      [class.is-active]="lab.isTokenInspectorOpen()"
      [class.is-idle]="!lab.isTokenInspectorOpen()"
      title="Conversation Telemetry — click to view full turn &amp; context diagnostics"
      aria-label="Conversation Telemetry"
    >
      <app-icon name="Activity" class="nav-telemetry-icon" />
      <span class="nav-telemetry-text">
        @if (cachedTokens > 0) {⚡ <strong>{{ inputTokens }}</strong> new} @else {In <strong>{{ inputTokens }}</strong>}
        · Out <strong>{{ outputTokens }}</strong>
      </span>
    </button>
  </div>
</header>
