<div class="composer-root">
  <div class="composer-inner">
    @if (showOalaSuggestion() && !streaming) {
      <div id="oala-suggestion" class="oala-suggestion">
        <button type="button" (click)="selectOala()" class="oala-suggestion-btn">
          <span class="oala-suggestion-title">&#64;Oala · Yuzee guidance</span>
          <span class="oala-suggestion-text">Understand our services and find a useful next step.</span>
        </button>
      </div>
    }
    <div class="oala-row">
      @if (oala().active) {
        <span class="oala-chip">
          &#64;Oala · Yuzee help
          <button type="button" [disabled]="streaming" aria-label="Remove Oala mention" (click)="clearOalaMention()" class="oala-chip-remove"><app-icon name="X" class="icon-3-5" /></button>
        </span>
        <app-micro-router-status />
      } @else {
        <button type="button" [disabled]="streaming" (click)="selectOala()" class="oala-ask">Ask <span class="oala-ask-name">&#64;Oala</span> about Yuzee services</button>
      }
    </div>
    <!-- Attachment chips -->
    @if (attachments().length > 0) {
      <div class="attachment-list">
        @for (att of attachments(); track $index; let i = $index) {
          <div class="attachment-chip">
            @if (att.previewUrl) {
              <img [src]="att.previewUrl" alt="" class="attachment-thumb" />
            } @else {
              <app-icon name="Paperclip" class="icon-3 shrink" />
            }
            <span class="attachment-name">{{ att.name }}</span>
            <button type="button" (click)="removeAttachment(i)" class="attachment-remove">
              <app-icon name="X" class="icon-3" />
            </button>
          </div>
        }
      </div>
    }

    <!-- Pill-shaped input -->
    <div class="composer-pill" [class.is-listening]="listening()">
      <!-- + attachment button -->
      <input #fileInput type="file" [accept]="acceptedFileTypes" multiple class="sr-only" tabindex="-1" (change)="onFiles($event)" />
      <button type="button" [disabled]="streaming" (click)="fileInput.click()" class="round-btn neutral-btn t-colors" title="Attach file (image, PDF, text)">
        <app-icon name="Plus" class="icon-4" />
      </button>

      <!-- Auto-growing textarea -->
      <textarea
        id="composer-input"
        #textarea
        rows="1"
        [value]="text()"
        (input)="onInput($event)"
        (keydown)="onKeydown($event)"
        aria-label="Your message"
        [attr.aria-describedby]="showOalaSuggestion() ? 'oala-suggestion' : null"
        [disabled]="streaming"
        placeholder="Tell me what you’d like help with…"
        class="composer-textarea"></textarea>

      <!-- Mic -->
      <button type="button" [disabled]="streaming" (click)="toggleMic()" class="round-btn" [class.mic-listening]="listening()" [class.neutral-btn]="!listening()" [title]="listening() ? 'Stop listening' : 'Voice input'">
        <app-icon [name]="listening() ? 'MicOff' : 'Mic'" class="icon-4" />
      </button>

      <!-- Circular send / stop -->
      @if (streaming) {
        <button id="btn-stop-stream" type="button" (click)="stop.emit()" class="round-btn stop-btn t-colors" title="Stop generation">
          <app-icon name="Square" fill="currentColor" class="icon-3-5" />
        </button>
      } @else {
        <button id="btn-send-message" type="button" (click)="handleSend()" [disabled]="!hasContent()" class="round-btn send-btn" [class.has-content]="hasContent()" title="Send (Enter)">
          <app-icon name="ArrowUp" class="icon-4" />
        </button>
      }
    </div>
  </div>
</div>
